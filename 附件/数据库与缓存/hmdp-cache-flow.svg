<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1290" viewBox="0 0 1500 1290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a5"/>
    </marker>
    <marker id="arwDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b2c0"/>
    </marker>
    <style>
      .title   { font-size: 30px; font-weight: 700; fill: #1f2733; }
      .cols    { font-size: 15px; font-weight: 600; fill: #8b95a5; letter-spacing: 1px; }
      .chip    { font-size: 17px; font-weight: 600; fill: #5a6b85; }
      .kt      { font-size: 21px; font-weight: 700; }
      .ks      { font-size: 15px; fill: #58637a; }
      .ct      { font-size: 16.5px; font-family: 'SF Mono','Menlo','Consolas',monospace; }
      .tag     { font-size: 14px; font-weight: 600; }
      .note    { font-size: 15.5px; fill: #3d4757; }
      .legend  { font-size: 14px; fill: #58637a; }
      .lnk     { stroke: #8b95a5; stroke-width: 2.5; fill: none; marker-end: url(#arw); }
      .lnkd    { stroke: #a9b2c0; stroke-width: 1.8; stroke-dasharray: 5 5; fill: none; marker-end: url(#arwDash); }
    </style>
  </defs>

  <rect width="1500" height="1290" fill="#ffffff"/>

  <text class="title" x="40" y="58">黑马点评 · 商户查询缓存 —— PPT 学习链路 ↔ 代码落点</text>
  <text class="cols" x="40" y="86">PPT 页码</text>
  <text class="cols" x="170" y="86">知识点（按 PPT 顺序）</text>
  <text class="cols" x="780" y="86">你项目里的代码与状态</text>

  <!-- legend -->
  <rect x="1120" y="40" width="16" height="16" rx="4" fill="#e9f7ee" stroke="#62b183"/>
  <text class="legend" x="1144" y="53">已实现</text>
  <rect x="1230" y="40" width="16" height="16" rx="4" fill="#f4f4f6" stroke="#b9b9c4" stroke-dasharray="5 4"/>
  <text class="legend" x="1254" y="53">未实现（后续课程）</text>
  <rect x="1420" y="40" width="16" height="16" rx="4" fill="#eef2fb" stroke="#8aa5d8"/>
  <text class="legend" x="1444" y="53">概念</text>

  <!-- ============ S1 什么是缓存 ============ -->
  <rect x="40" y="178" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="206" text-anchor="middle">29-30</text>
  <rect x="170" y="150" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="186" fill="#2b4a80">什么是缓存</text>
  <text class="ks" x="194" y="214">作用：降低后端负载、提高读写效率</text>
  <text class="ks" x="194" y="236">成本：数据一致性、代码维护、运维</text>
  <rect x="780" y="150" width="700" height="100" rx="14" fill="#f7f8fa" stroke="#e2e6ee" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="ct" x="804" y="196" fill="#7c8698">概念章节，没有对应代码</text>

  <!-- ============ S2 添加 Redis 缓存 ============ -->
  <rect x="40" y="308" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="336" text-anchor="middle">31-34</text>
  <rect x="170" y="280" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="316" fill="#2b4a80">添加 Redis 缓存</text>
  <text class="ks" x="194" y="344">查缓存 → 未命中查库 → 回写缓存</text>
  <text class="ks" x="194" y="366">练习：给店铺类型列表加缓存</text>
  <rect x="780" y="280" width="700" height="100" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="316" fill="#1d6b3d">ShopTypeServiceImpl.querySort()</text>
  <text class="ct" x="804" y="342" fill="#1d6b3d">ShopTypeController.queryTypeList() → querySort()</text>
  <text class="tag" x="804" y="366" fill="#1d6b3d">✓ 已实现（key=shop:type，按课程设计不设 TTL）</text>

  <!-- ============ S3 缓存更新策略 ============ -->
  <rect x="40" y="438" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="466" text-anchor="middle">36-43</text>
  <rect x="170" y="410" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="446" fill="#2b4a80">缓存更新策略</text>
  <text class="ks" x="194" y="474">内存淘汰 / 超时剔除 / 主动更新</text>
  <text class="ks" x="194" y="496">主动更新：先写数据库，再删缓存（Cache Aside）</text>
  <rect x="780" y="410" width="700" height="100" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="446" fill="#1d6b3d">ShopServiceImpl.update()  @Transactional</text>
  <text class="ct" x="804" y="472" fill="#1d6b3d">updateById(shop) → delete(cache:shop:{id})</text>
  <text class="tag" x="804" y="496" fill="#1d6b3d">✓ 已实现（ShopController.updateShop 已改调 update；30 分钟 TTL 兜底）</text>

  <!-- ============ S4 缓存穿透 ============ -->
  <rect x="40" y="568" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="596" text-anchor="middle">45-50</text>
  <rect x="170" y="540" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="576" fill="#2b4a80">缓存穿透</text>
  <text class="ks" x="194" y="604">缓存空对象 / 布隆过滤</text>
  <text class="ks" x="194" y="626">isNotBlank + != null 两次判断区分三种情况</text>
  <rect x="780" y="540" width="700" height="100" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="576" fill="#1d6b3d">ShopServiceImpl.queryWithPassThrough()</text>
  <text class="ct" x="804" y="602" fill="#1d6b3d">CacheClient.queryWithPassThrough(..., this::getById, ...)</text>
  <text class="tag" x="804" y="626" fill="#1d6b3d">✓ 已实现（空值 TTL = CACHE_NULL_TTL 2 分钟）</text>

  <!-- ============ S5 缓存雪崩 ============ -->
  <rect x="40" y="698" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="726" text-anchor="middle">52</text>
  <rect x="170" y="670" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="706" fill="#2b4a80">缓存雪崩</text>
  <text class="ks" x="194" y="734">TTL 加随机值 / Redis 集群 / 降级限流 / 多级缓存</text>
  <text class="ks" x="194" y="756">大量 key 同时失效或 Redis 宕机</text>
  <rect x="780" y="670" width="700" height="100" rx="14" fill="#f4f4f6" stroke="#b9b9c4" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text class="ct" x="804" y="706" fill="#6c6c7a">未实现 —— 后续课程 / 老师会讲</text>
  <text class="ct" x="804" y="732" fill="#6c6c7a">解决思路：TTL 加随机值 / Redis 集群 / 降级限流 / 多级缓存</text>
  <text class="tag" x="804" y="756" fill="#6c6c7a">◇ 本项目这块留白，先理解问题本身</text>

  <!-- ============ S6 缓存击穿 ============ -->
  <rect x="40" y="828" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="856" text-anchor="middle">54-58</text>
  <rect x="170" y="800" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="836" fill="#2b4a80">缓存击穿（热点 key 失效）</text>
  <text class="ks" x="194" y="864">两套方案：互斥锁（保一致性、要等待）</text>
  <text class="ks" x="194" y="886">逻辑过期（不等线程、不保一致性）</text>

  <rect x="780" y="790" width="700" height="86" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="822" fill="#1d6b3d">方案 A 互斥锁：queryWithMutex() + tryLock() / unlock()</text>
  <text class="tag" x="804" y="852" fill="#1d6b3d">只放一个线程重建、其余休眠重试 —— 保一致性，线程要等</text>

  <rect x="780" y="886" width="700" height="86" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="918" fill="#1d6b3d">方案 B 逻辑过期：queryWithLogicalExpire() + RedisData + 线程池</text>
  <text class="ct" x="804" y="942" fill="#1d6b3d">命中但已逻辑过期 → 抢锁、异步重建，先返回旧数据</text>
  <text class="tag" x="804" y="964" fill="#1d6b3d">不阻塞线程，不保证强一致，依赖提前预热</text>

  <!-- ============ S7 缓存工具类封装 ============ -->
  <rect x="40" y="1068" width="110" height="44" rx="10" fill="#f5f7fa" stroke="#dfe4ec"/>
  <text class="chip" x="95" y="1096" text-anchor="middle">59-60</text>
  <rect x="170" y="1040" width="470" height="100" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="kt" x="194" y="1076" fill="#2b4a80">缓存工具类封装</text>
  <text class="ks" x="194" y="1104">PPT 要求 4 个方法：写缓存 / 写逻辑过期</text>
  <text class="ks" x="194" y="1126">/ 查缓存防穿透 / 查缓存防击穿</text>
  <rect x="780" y="1040" width="700" height="100" rx="14" fill="#e9f7ee" stroke="#62b183" stroke-width="1.8"/>
  <text class="ct" x="804" y="1076" fill="#1d6b3d">CacheClient.set() / setWithLogicalExpire()</text>
  <text class="ct" x="804" y="1102" fill="#1d6b3d">queryWithPassThrough() / queryWithLogicalExpire()</text>
  <text class="tag" x="804" y="1126" fill="#1d6b3d">✓ 已实现（泛型 &lt;R, ID&gt; + Function&lt;ID, R&gt; dbFallback）</text>

  <!-- ============ 主轴箭头 ============ -->
  <path class="lnk" d="M 405 250 L 405 274"/>
  <path class="lnk" d="M 405 380 L 405 404"/>
  <path class="lnk" d="M 405 510 L 405 534"/>
  <path class="lnk" d="M 405 640 L 405 664"/>
  <path class="lnk" d="M 405 770 L 405 794"/>
  <path class="lnk" d="M 405 900 L 405 1034"/>

  <!-- ============ 指向代码的虚线 ============ -->
  <path class="lnkd" d="M 640 200 L 774 200"/>
  <path class="lnkd" d="M 640 330 L 774 330"/>
  <path class="lnkd" d="M 640 460 L 774 460"/>
  <path class="lnkd" d="M 640 590 L 774 590"/>
  <path class="lnkd" d="M 640 720 L 774 720"/>
  <path class="lnkd" d="M 640 833 L 720 833 L 720 833 L 774 833"/>
  <path class="lnkd" d="M 640 880 L 740 880 L 740 929 L 774 929"/>
  <path class="lnkd" d="M 640 1090 L 774 1090"/>

  <!-- 当前生效链路标注 -->
  <rect x="1130" y="986" width="350" height="40" rx="12" fill="#e9f7ee" stroke="#62b183" stroke-width="1.6"/>
  <text class="tag" x="1150" y="1012" fill="#1d6b3d">★ queryById 当前生效的就是方案 B</text>

  <!-- ============ 底部说明 ============ -->
  <rect x="40" y="1170" width="1440" height="96" rx="14" fill="#f7f8fa" stroke="#e2e6ee" stroke-width="1.5"/>
  <text class="note" x="64" y="1200">当前实际链路：ShopController → ShopServiceImpl.queryById → CacheClient.queryWithLogicalExpire（另三处调用被注释保留）</text>
  <text class="note" x="64" y="1222">三个高频问题速记：穿透 = 缓存和数据库都没有（空对象 / 布隆过滤） ｜ 击穿 = 单个热点 key 失效（互斥锁 / 逻辑过期）</text>
  <text class="note" x="64" y="1248">雪崩 = 大量 key 同时失效或 Redis 宕机（TTL 加随机值 / Redis 集群 / 降级限流 / 多级缓存，本项目留待后续课程实现）</text>
</svg>
