<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #1f2733; }
      .sub   { font-size: 15px; fill: #7c8698; }
      .sec   { font-size: 21px; font-weight: 700; fill: #1f2733; }
      .ct    { font-size: 17px; font-weight: 700; fill: #1f2733; }
      .lb    { font-size: 14.5px; fill: #58637a; }
      .code  { font-size: 15px; font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #3d4757; }
      .tiny  { font-size: 12.5px; fill: #7c8698; }
      .num   { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1520" height="980" fill="#ffffff"/>

  <text class="title" x="48" y="56">那为什么还要有 Integer？—— 必须用包装类的场合与代价</text>
  <text class="sub" x="48" y="88">基本类型不是对象，进不了 Java 的「对象世界」；包装类就是那张入场券</text>

  <!-- ============ 左：为什么需要 ============ -->
  <text class="sec" x="48" y="140">五个必须用 Integer 的场景</text>

  <rect x="48" y="162" width="752" height="112" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <rect x="68" y="182" width="30" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="83" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a80">1</text>
  <text class="ct" x="114" y="204">泛型与集合：List&lt;Integer&gt;</text>
  <text class="lb" x="114" y="234">泛型参数只能是引用类型，List&lt;int&gt; 编译不过；集合里装的每个元素都必须先是对象。</text>

  <rect x="48" y="288" width="752" height="112" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <rect x="68" y="308" width="30" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="83" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a80">2</text>
  <text class="ct" x="114" y="330">需要表达「没有值」</text>
  <text class="lb" x="114" y="360">数据库可空列、查不到的结果、还没赋值的字段 —— 只有引用类型能写 null。</text>
  <text class="lb" x="114" y="386">用 int 就得拿 0 去冒充「没有」，可 0 本身也是合法数据，两者再也分不开。</text>

  <rect x="48" y="414" width="752" height="112" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <rect x="68" y="434" width="30" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="83" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a80">3</text>
  <text class="ct" x="114" y="456">要放进 Object 的位置</text>
  <text class="lb" x="114" y="486">Object[] 数组、Object 形参、反射 Method.invoke 的返回值、JSON 序列化、Map 的 key，</text>
  <text class="lb" x="114" y="512">这些地方基本类型根本递不进去 —— 它不是 Object 的子类。</text>

  <rect x="48" y="540" width="752" height="112" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <rect x="68" y="560" width="30" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="83" y="581" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a80">4</text>
  <text class="ct" x="114" y="582">需要类型自带的工具与常量</text>
  <text class="code" x="114" y="612">Integer.parseInt、Integer.toBinaryString、Integer.MAX_VALUE、Integer.compare …</text>
  <text class="lb" x="114" y="638">基本类型连「方法」这个概念都没有，转换只能靠包装类来兜。</text>

  <rect x="48" y="666" width="752" height="112" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <rect x="68" y="686" width="30" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="83" y="707" text-anchor="middle" font-size="15" font-weight="700" fill="#2b4a80">5</text>
  <text class="ct" x="114" y="708">需要进入类型体系（多态）</text>
  <text class="lb" x="114" y="738">Number 抽象类让 Integer / Long / Double 有了共同的父类型，方法可以只声明收 Number；</text>
  <text class="lb" x="114" y="764">基本类型没有继承关系，做不到这一点。</text>

  <!-- ============ 右：代价 ============ -->
  <text class="sec" x="848" y="140">但代价是真实存在的</text>

  <rect x="848" y="162" width="624" height="140" rx="12" fill="#fdf3e3" stroke="#d9a441" stroke-width="1.6"/>
  <text class="ct" x="872" y="196" fill="#8a5a12">内存约 5 倍</text>
  <text class="lb" x="872" y="230">int 只占 4 字节；Integer 要 4 字节引用 + 16 字节对象 = 20 字节。</text>
  <text class="lb" x="872" y="258">实测 100 万个元素：int[] 3.8 MB → Integer[] 19.1 MB。</text>
  <text class="lb" x="872" y="286" fill="#8a5a12">对象头（12 字节）就是这份开销的大头。</text>

  <rect x="848" y="318" width="624" height="140" rx="12" fill="#fdf3e3" stroke="#d9a441" stroke-width="1.6"/>
  <text class="ct" x="872" y="352" fill="#8a5a12">GC 压力</text>
  <text class="lb" x="872" y="386">堆上凭空多出 100 万个活对象，标记、复制、整理都要花时间。</text>
  <text class="lb" x="872" y="414">大量短命的小包装对象会把年轻代撑爆，触发更频繁的 Young GC。</text>
  <text class="lb" x="872" y="442" fill="#8a5a12">反过来，int 只跟着栈帧走，方法结束就没了。</text>

  <rect x="848" y="474" width="624" height="140" rx="12" fill="#fdf3e3" stroke="#d9a441" stroke-width="1.6"/>
  <text class="ct" x="872" y="508" fill="#8a5a12">CPU 缓存不友好</text>
  <text class="lb" x="872" y="542">连续存放的 int 数组，一条 cache line 能装下十几个数值；</text>
  <text class="lb" x="872" y="570">换成 Integer 数组后，元素散落在堆上，取数要跟着引用跳，cache miss 明显更多。</text>
  <text class="lb" x="872" y="598" fill="#8a5a12">量大时，这比那点额外内存更致命。</text>

  <rect x="848" y="630" width="624" height="140" rx="12" fill="#fdf3e3" stroke="#d9a441" stroke-width="1.6"/>
  <text class="ct" x="872" y="664" fill="#8a5a12">语义陷阱</text>
  <text class="lb" x="872" y="698">== 比的是地址：127 == 127 为 true，128 == 128 却为 false。</text>
  <text class="lb" x="872" y="726">自动拆箱可能抛 NullPointerException；包装类可变共享时也不再安全。</text>
  <text class="lb" x="872" y="754" fill="#8a5a12">比较数值请一律用 equals()。</text>

  <!-- ============ 结论 ============ -->
  <rect x="48" y="812" width="1424" height="126" rx="14" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.8"/>
  <text class="num" x="76" y="856" font-size="20" fill="#2b4a80">一句话记住：int 是数据本身，Integer 是「装着数据的对象」。</text>
  <text class="lb" x="76" y="892" font-size="16" fill="#3d4757">局部变量、循环计数、数组、性能敏感的运算 → 用 int；</text>
  <text class="lb" x="76" y="918" font-size="16" fill="#3d4757">要进集合或泛型、要允许 null、要以对象身份参与（反射 / 序列化 / 多态） → 用 Integer。</text>
</svg>
