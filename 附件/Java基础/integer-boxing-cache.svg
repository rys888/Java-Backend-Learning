<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1220" viewBox="0 0 1520 1220" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a5"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #1f2733; }
      .sub   { font-size: 15px; fill: #7c8698; }
      .sec   { font-size: 21px; font-weight: 700; fill: #1f2733; }
      .code  { font-size: 16px; font-family: 'SF Mono','Menlo','Consolas',monospace; fill: #1f2733; }
      .lb    { font-size: 14.5px; fill: #58637a; }
      .note  { font-size: 15px; fill: #3d4757; }
      .tiny  { font-size: 12.5px; fill: #7c8698; }
      .num   { font-size: 17px; font-weight: 700; }
      .arrow { stroke: #8b95a5; stroke-width: 2.5; fill: none; marker-end: url(#arw); }
    </style>
  </defs>

  <rect width="1520" height="1220" fill="#ffffff"/>

  <text class="title" x="48" y="56">自动装箱背后：Integer.valueOf() 与缓存池</text>
  <text class="sub" x="48" y="88">Integer b = 10; 并不是凭空得到对象，javac 会替你插入一次方法调用</text>

  <!-- ============ 左：装箱流程 ============ -->
  <text class="sec" x="48" y="146">装箱（boxing）到底发生了什么</text>

  <rect x="48" y="170" width="846" height="56" rx="10" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <text class="code" x="72" y="205">Integer b = 10;</text>

  <path class="arrow" d="M 471 226 V 250"/>
  <text class="tiny" x="485" y="244">javac 编译期改写</text>

  <rect x="48" y="256" width="846" height="64" rx="10" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.6"/>
  <text class="lb" x="72" y="282">编译后等价于</text>
  <text class="code" x="72" y="308" fill="#2b4a80">Integer b = Integer.valueOf(10);</text>

  <path class="arrow" d="M 471 320 V 344"/>

  <rect x="48" y="350" width="846" height="64" rx="10" fill="#fff7e6" stroke="#d9a441" stroke-width="1.6"/>
  <text class="note" x="72" y="389">Integer.valueOf(int i) 内部：先判断 i 是否落在 [-128, 127] 之内</text>

  <path class="arrow" d="M 248 414 V 436"/>
  <path class="arrow" d="M 694 414 V 436"/>
  <text class="tiny" x="258" y="430" fill="#1d6b3d">在范围内</text>
  <text class="tiny" x="704" y="430" fill="#8a5a12">超出范围</text>

  <rect x="48" y="440" width="400" height="120" rx="10" fill="#e9f7ee" stroke="#62b183" stroke-width="1.6"/>
  <text class="num" x="72" y="472" fill="#1d6b3d">命中：拿缓存里现成的对象</text>
  <text class="code" x="72" y="502" font-size="14" fill="#1d6b3d">return IntegerCache.cache[i + 128];</text>
  <text class="lb" x="72" y="532">0 次新分配，两个变量会指向同一个对象</text>

  <rect x="494" y="440" width="400" height="120" rx="10" fill="#fdf3e3" stroke="#d9a441" stroke-width="1.6"/>
  <text class="num" x="518" y="472" fill="#8a5a12">未命中：在堆上新建一个</text>
  <text class="code" x="518" y="502" font-size="14" fill="#8a5a12">return new Integer(i);</text>
  <text class="lb" x="518" y="532">16 字节的对象，之后交给 GC 回收</text>

  <path class="arrow" d="M 248 560 V 592"/>
  <path class="arrow" d="M 694 560 V 592"/>
  <rect x="48" y="596" width="846" height="58" rx="10" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <text class="note" x="72" y="632">两种情况下 b 都是一个 Integer 对象的引用 —— 区别只在于要不要新分配内存。</text>

  <rect x="48" y="684" width="846" height="116" rx="10" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <text class="num" x="72" y="716">反向：拆箱（unboxing）</text>
  <text class="code" x="72" y="748">int x = b;　　// javac 改写为 int x = b.intValue();</text>
  <text class="lb" x="72" y="778" fill="#b04a3a">注意：如果 b 是 null，这一行会抛 NullPointerException —— 自动拆箱最经典的坑。</text>

  <!-- ============ 右：缓存池 ============ -->
  <text class="sec" x="930" y="146">缓存池 IntegerCache 长什么样</text>
  <text class="lb" x="930" y="186">IntegerCache.cache（static final Integer[]，共 256 个槽）</text>

  <rect x="930" y="200" width="90" height="66" rx="8" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.6"/>
  <text class="tiny" x="975" y="222" text-anchor="middle">索引 0</text>
  <text x="975" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#2b4a80">-128</text>

  <rect x="1030" y="200" width="90" height="66" rx="8" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.6"/>
  <text class="tiny" x="1075" y="222" text-anchor="middle">索引 1</text>
  <text x="1075" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#2b4a80">-127</text>

  <text x="1136" y="246" text-anchor="middle" font-size="20" fill="#b6bfcd">…</text>

  <rect x="1160" y="200" width="90" height="66" rx="8" fill="#e9f7ee" stroke="#62b183" stroke-width="1.6"/>
  <text class="tiny" x="1205" y="222" text-anchor="middle">索引 128</text>
  <text x="1205" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#1d6b3d">0</text>

  <text x="1266" y="246" text-anchor="middle" font-size="20" fill="#b6bfcd">…</text>

  <rect x="1290" y="200" width="90" height="66" rx="8" fill="#e9f7ee" stroke="#62b183" stroke-width="1.6"/>
  <text class="tiny" x="1335" y="222" text-anchor="middle">索引 255</text>
  <text x="1335" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#1d6b3d">127</text>

  <text class="note" x="930" y="300">· 类加载时就一次性创建好这 256 个 Integer 对象（约 4 KB）</text>
  <text class="note" x="930" y="328">· 它们被一个静态数组强引用着，永远不会被 GC 回收</text>
  <text class="note" x="930" y="356">· 所以 Integer.valueOf(127) 两次拿到的是同一个对象</text>

  <text class="num" x="930" y="404" font-size="16">各包装类的缓存范围</text>
  <rect x="930" y="418" width="542" height="40" rx="6" fill="#f7f9fc"/>
  <text class="lb" x="950" y="444">Integer / Byte / Short / Long：-128 ~ 127</text>
  <rect x="930" y="458" width="542" height="40" rx="6" fill="#ffffff" stroke="#eef0f5"/>
  <text class="lb" x="950" y="484">Character：0 ~ 127</text>
  <rect x="930" y="498" width="542" height="40" rx="6" fill="#f7f9fc"/>
  <text class="lb" x="950" y="524">Boolean：只有 TRUE / FALSE 两个常量</text>
  <rect x="930" y="538" width="542" height="40" rx="6" fill="#ffffff" stroke="#eef0f5"/>
  <text class="lb" x="950" y="564">Float / Double：没有缓存，每次都要新建</text>
  <text class="tiny" x="930" y="600">提示：-XX:AutoBoxCacheMax 只能调大 Integer 的缓存上限</text>

  <!-- ============ 下：== 陷阱 ============ -->
  <rect x="48" y="830" width="36" height="30" rx="9" fill="#eef2fb" stroke="#8aa5d8"/>
  <text x="66" y="851" text-anchor="middle" font-size="17" font-weight="700" fill="#2b4a80">③</text>
  <text class="sec" x="98" y="853">缓存池带来的经典陷阱：== 在这里会骗你</text>

  <rect x="48" y="880" width="700" height="230" rx="12" fill="#f7f9fc" stroke="#d8dfea" stroke-width="1.6"/>
  <text class="code" x="72" y="922">Integer a = 127, b = 127;</text>
  <text class="code" x="72" y="956">Integer c = 128, d = 128;</text>
  <text class="code" x="72" y="990">Integer e = new Integer(10);</text>
  <text class="code" x="72" y="1024">System.out.println(a == b);</text>
  <text class="code" x="72" y="1058">System.out.println(c == d);</text>
  <text class="code" x="72" y="1092">System.out.println(c.equals(d));</text>

  <rect x="780" y="880" width="692" height="230" rx="12" fill="#ffffff" stroke="#e3e8f0" stroke-width="1.6"/>
  <text class="code" x="804" y="922" font-size="15">a == b</text>
  <text class="lb" x="1060" y="922" fill="#1d6b3d" font-weight="600">true　都是缓存里同一个对象</text>
  <text class="code" x="804" y="956" font-size="15">c == d</text>
  <text class="lb" x="1060" y="956" fill="#b04a3a" font-weight="600">false　128 超出缓存，两个不同对象</text>
  <text class="code" x="804" y="990" font-size="15">c.equals(d)</text>
  <text class="lb" x="1060" y="990" fill="#1d6b3d" font-weight="600">true　equals 比的是数值</text>
  <text class="code" x="804" y="1024" font-size="15">e == new Integer(10)</text>
  <text class="lb" x="1060" y="1024" fill="#b04a3a" font-weight="600">false　new 一定不共享</text>
  <text class="code" x="804" y="1058" font-size="15">a == 127</text>
  <text class="lb" x="1060" y="1058" fill="#1d6b3d" font-weight="600">true　一边是 int，会先拆箱再比数值</text>
  <text class="tiny" x="804" y="1092">规律：只要两边都是包装类型，== 比的就是地址</text>

  <rect x="48" y="1130" width="1424" height="62" rx="12" fill="#eef2fb" stroke="#8aa5d8" stroke-width="1.6"/>
  <text class="num" x="72" y="1170" font-size="17" fill="#2b4a80">结论：== 比的是引用地址，equals 比的才是数值。比较两个包装类的值，永远用 equals() 或先 intValue()。</text>
</svg>
